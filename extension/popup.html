<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SaveVid.net</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="head">
      <img class="logo" src="logo.svg" width="36" height="36" alt="" />
      <div class="head-text">
        <h1>SaveVid.net</h1>
        <p class="tagline">Save video &amp; audio in one click</p>
      </div>
      <button id="themeBtn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
        </svg>
      </button>
    </header>

    <section id="panel" class="panel hidden" aria-live="polite">
      <div class="thumb-wrap">
        <img id="thumb" class="thumb" alt="" />
        <div class="thumb-fallback" id="thumbFallback">SV</div>
      </div>
      <div class="meta">
        <p id="title" class="title">—</p>
        <p id="submeta" class="submeta">—</p>
      </div>
    </section>

    <section id="quick" class="quick hidden">
      <h2 class="section-label">Quick pick</h2>
      <div id="quickGrid" class="grid"></div>
    </section>

    <section id="formats" class="hidden">
      <h2 class="section-label">Video quality</h2>
      <div id="videoGrid" class="grid"></div>
      <h2 class="section-label">Audio</h2>
      <div id="audioGrid" class="grid"></div>
    </section>

    <section class="fallback">
      <h2 class="section-label">Or paste a link</h2>
      <div class="row">
        <input id="urlInput" type="url" inputmode="url" spellcheck="false"
               placeholder="https://…" aria-label="Video URL" />
        <button id="goBtn" class="btn btn-primary">Load</button>
      </div>
    </section>

    <div id="status" class="status hidden" role="status"></div>

    <div id="progressWrap" class="progress hidden">
      <div class="progress-bar"><div id="progressBar" class="progress-fill"></div></div>
      <span id="progressText" class="progress-text">0%</span>
    </div>

    <footer class="foot">
      <a href="https://savevid.net" target="_blank" rel="noopener noreferrer">savevid.net</a>
      <span class="dot">•</span>
      <span>Only save content you own or have rights to.</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
